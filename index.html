<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phresh - CBD & THC Baked Goods</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <header class="hero">
    <div class="nav">
      <div class="logo">PHRESH</div>
      <nav>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <button id="themeToggle" title="Toggle Dark Mode"><i data-feather="moon"></i></button>
      </nav>
    </div>

    <div class="container">
      <div class="left">
        <h1>CBD Products & THC-Infused Baked Goods</h1>
        <p>Made from plant-based and sustainably sourced ingredients.</p>
        <a href="#" class="shop-button">SHOP NOW</a>
      </div>

      <div class="right">
        <div class="iphone-mockup">
          <div class="screen">
            <h3 class="mockup-title">PHRESH</h3>
            <ul class="product-list">
              <li>
                <img src="https://i.imgur.com/NKXyPbp.png" alt="Brownie">
                <div>
                  <strong>THC Brownie</strong><br><span>$12.00</span>
                </div>
                <button class="add-cart" data-name="THC Brownie" data-price="12">+</button>
              </li>
              <li>
                <img src="https://i.imgur.com/J9Gl3JG.png" alt="CBD Oil">
                <div>
                  <strong>CBD Oil</strong><br><span>$40.00</span>
                </div>
                <button class="add-cart" data-name="CBD Oil" data-price="40">+</button>
              </li>
              <li>
                <img src="https://i.imgur.com/UMuMQWm.png" alt="THC Gummies">
                <div>
                  <strong>THC Gummies</strong><br><span>$35.00</span>
                </div>
                <button class="add-cart" data-name="THC Gummies" data-price="35">+</button>
              </li>
              <li>
                <img src="https://i.imgur.com/kMG0SwC.png" alt="CBD Gummies">
                <div>
                  <strong>CBD Gummies</strong><br><span>$55.00</span>
                </div>
                <button class="add-cart" data-name="CBD Gummies" data-price="55">+</button>
              </li>
              <li>
                <img src="https://i.imgur.com/UtS0EEX.png" alt="THC Balm">
                <div>
                  <strong>THC Balm</strong><br><span>$20.00</span>
                </div>
                <button class="add-cart" data-name="THC Balm" data-price="20">+</button>
              </li>
            </ul>
          </div>
        </div>
        <div class="cart-box">
          <h4>🛒 Cart</h4>
          <ul id="cart-list"></ul>
          <p>Total: $<span id="total">0</span></p>
        </div>
      </div>
    </div>
  </header>

  <script>
    feather.replace();

    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    const cart = [];
    const cartList = document.getElementById('cart-list');
    const totalDisplay = document.getElementById('total');

    document.querySelectorAll('.add-cart').forEach(button => {
      button.addEventListener('click', () => {
        const name = button.dataset.name;
        const price = parseFloat(button.dataset.price);
        cart.push({ name, price });
        updateCart();
      });
    });

    function updateCart() {
      cartList.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${item.price}`;
        cartList.appendChild(li);
        total += item.price;
      });
      totalDisplay.textContent = total.toFixed(2);
    }
  </script>
</body>
</html>
